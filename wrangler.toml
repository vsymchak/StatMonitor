name = "statmonitor"
main = "deploy/cloudflare_webhook.js"
compatibility_date = "2024-01-01"

# Безкоштовний пінг Render Free Web Service (/healthz) кожні 10 хв (запобігає засинанню через 15 хв).
# GitHub Actions по крону звідси НЕ запускається (працює лише кнопка '⚡ Запуск' по HTTP).
[triggers]
crons = ["*/10 * * * *"]
