name: StatMonitor Auto Check

on:
  # Регулярний розклад кожні 30 хв (активний для публічного репозиторію без ліміту хвилин GitHub Actions)
  schedule:
    - cron: '*/30 * * * *'

  # Ручний запуск через кнопку "Run workflow" у GitHub Actions залишено активним
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Джерело запуску (manual, external_webhook, watchdog)'
        required: false
        default: 'manual'

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run StatMonitor script
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROPLINE_API: ${{ secrets.PROPLINE_API }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_RESERVE: ${{ secrets.ODDS_API_KEY_RESERVE }}
          ODDS_API_KEY_RESERVE1: ${{ secrets.ODDS_API_KEY_RESERVE1 }}
          ODDS_API_KEY_RESERVE2: ${{ secrets.ODDS_API_KEY_RESERVE2 }}
          ODDS_API_KEY_RESERVE3: ${{ secrets.ODDS_API_KEY_RESERVE3 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SX_BET_API_KEY: ${{ secrets.SX_BET_API_KEY || secrets.MY_GEM_BOT }}
          SX_BET_PRIVATE_KEY: ${{ secrets.SX_BET_PRIVATE_KEY }}
          SX_BET_WALLET_ADDRESS: ${{ secrets.SX_BET_WALLET_ADDRESS }}
          SX_BET_PROXY_ADDRESS: ${{ secrets.SX_BET_PROXY_ADDRESS }}
          SX_BET_SAFE_ADDRESS: ${{ secrets.SX_BET_SAFE_ADDRESS }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || (github.event_name == 'schedule' && 'cron_5m' || 'manual') }}
        run: |
          python -u main.py
