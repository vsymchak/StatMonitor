name: StatMonitor Auto Check

on:
  # Smart Self-Scheduled Executor (кожні 5 хв: 00, 05, 10, 15, 20...)
  # Програмний шлюз (Smart Gate) у main.py перевіряє таблицю scheduler_plan:
  # якщо немає активних точок (±15 хв) або розрахунків, запуск завершується за 1 сек без витрат квоти.
  schedule:
    - cron: '*/5 * * * *'
  # Високоточний миттєвий запуск через Webhook / UI Дашборд / Ручний запуск
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Джерело запуску (manual, external_webhook, watchdog)'
        required: false
        default: 'manual'

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary matplotlib

      - name: Run StatMonitor script
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_RESERVE: ${{ secrets.ODDS_API_KEY_RESERVE }}
          ODDS_API_KEY_RESERVE1: ${{ secrets.ODDS_API_KEY_RESERVE1 }}
          ODDS_API_KEY_RESERVE2: ${{ secrets.ODDS_API_KEY_RESERVE2 }}
          ODDS_API_KEY_RESERVE3: ${{ secrets.ODDS_API_KEY_RESERVE3 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || (github.event_name == 'schedule' && 'cron_5m' || 'manual') }}
        run: |
          python -u main.py
