name: StatMonitor Auto Check

on:
  # Резервний регулярний розклад GitHub Actions (кожні 15 хв: 00, 15, 30, 45)
  schedule:
    - cron: '*/15 * * * *'
  # Високоточний миттєвий запуск через Webhook / Cloudflare Worker / UI Дашборд
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Джерело запуску (manual, external_webhook, watchdog)'
        required: false
        default: 'manual'

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary matplotlib

      - name: Run StatMonitor script
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_RESERVE: ${{ secrets.ODDS_API_KEY_RESERVE }}
          ODDS_API_KEY_RESERVE1: ${{ secrets.ODDS_API_KEY_RESERVE1 }}
          ODDS_API_KEY_RESERVE2: ${{ secrets.ODDS_API_KEY_RESERVE2 }}
          ODDS_API_KEY_RESERVE3: ${{ secrets.ODDS_API_KEY_RESERVE3 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || 'external_webhook' }}
        run: |
          python -u main.py
